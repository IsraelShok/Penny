Port 8888
Listen 0.0.0.0
Timeout 600
MaxClients 100
LogLevel Notice
# Deny everything except the hosts in the generated filter file (built from allowlist.txt).
Filter "/tmp/filter"
FilterType ere
FilterDefaultDeny Yes
FilterURLs No
FilterCaseSensitive No
# HTTPS tunnels only to port 443.
ConnectPort 443
DisableViaHeader Yes
