services:
  penny:
    build:
      context: .
      args:
        # Set by Penny-docker.ps1 / Penny-update.ps1 from git, so the update check knows the running version.
        PENNY_COMMIT: ${PENNY_COMMIT:-unknown}
    image: penny:latest
    container_name: penny
    restart: unless-stopped
    ports:
      # Reachable from this computer only.
      - "127.0.0.1:41234:41234"
    env_file:
      - path: .env
        required: false
    environment:
      # The container is the sandbox; Chromium's own sandbox needs privileges a container does not have.
      PENNY_DISABLE_CHROMIUM_SANDBOX: "1"
      # Tell the user (in Telegram) when a newer version exists. Nothing is installed automatically.
      PENNY_UPDATE_CHECK: ${PENNY_UPDATE_CHECK:-1}
    volumes:
      # legacy: spent-data volume from installs before the Penny rename (renaming it would orphan existing data)
      - spent-data:/data
    security_opt:
      - no-new-privileges:true

volumes:
  spent-data:
